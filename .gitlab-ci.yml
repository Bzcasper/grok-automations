stages:
  - validate
  - lint
  - security
  - package
  - release

variables:
  PACKAGE_NAME: "grok-automations"

# ---------- validate ----------
verify:
  stage: validate
  image: python:3.12-slim
  script:
    - python3 scripts/verify-prompts.py
    - python3 scripts/check-readme.py
    - |
      if grep -R "shopgoodwill.com" 01-sourcing-auctions/ | grep -qi "DEFAULTS - Sites"; then
        echo "shopgoodwill found in a sourcing Sites default"; exit 1;
      fi
      echo "ok"
# ---------- lint ----------
markdown-lint:
  stage: lint
  image:
    name: davidanson/markdownlint-cli2:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - markdownlint-cli2 "**/*.md" "#node_modules"

links:
  stage: lint
  image:
    name: lycheeverse/lychee:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - lychee --no-progress "**/*.md"

# ---------- security ----------
secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact

# ---------- package ----------
package:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - mkdir -p dist
    - zip -r "dist/${PACKAGE_NAME}-${CI_COMMIT_SHORT_SHA}.zip"
        01-sourcing-auctions 02-pricing-comps 03-listings-inventory
        04-youtube-content 05-social-shortform 06-business-intel
        07-weekly-synthesis AGENTS.md README.md NOTION-GROK-PLAYBOOK.md
        scripts -x "*/node_modules/*"
  artifacts:
    name: "${PACKAGE_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/*.zip
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------- release ----------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - package
  script:
    - |
      glab release create "${CI_COMMIT_TAG}" dist/*.zip \
        --name "Release ${CI_COMMIT_TAG}" \
        --notes "Automated release of the grok-automations prompt pack."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  when: manual

# ---------- scheduled nightly link check ----------
nightly-links:
  stage: lint
  image:
    name: lycheeverse/lychee:latest
    entrypoint: [""]
  script:
    - lychee --no-progress "**/*.md"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
