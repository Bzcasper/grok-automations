name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify prompt pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify prompt skeleton
        run: python3 scripts/verify-prompts.py
      - name: README index consistency
        run: python3 scripts/check-readme.py
      - name: No shopgoodwill in sourcing Sites defaults
        run: |
          if grep -R "shopgoodwill.com" 01-sourcing-auctions/ | grep -qi "DEFAULTS - Sites"; then
            echo "shopgoodwill found in a sourcing Sites default"; exit 1
          fi
          echo "ok"

  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  release:
    name: Package & release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build bundle
        run: |
          mkdir -p dist
          zip -r "dist/grok-automations-${GITHUB_REF_NAME}.zip" \
            01-sourcing-auctions 02-pricing-comps 03-listings-inventory \
            04-youtube-content 05-social-shortform 06-business-intel \
            07-weekly-synthesis AGENTS.md README.md NOTION-GROK-PLAYBOOK.md \
            scripts -x "*/node_modules/*"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
